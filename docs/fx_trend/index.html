.info-label{font-size:.72rem;color:#555;margin-bottom:8px;letter-spacing:1px}
.info-value{font-size:1.3rem;font-weight:bold;color:#ccc}

.chart-title{font-size:.75rem;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.footer{color:#333;font-size:.72rem;text-align:center;margin-top:8px}
