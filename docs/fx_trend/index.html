* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a1a;
  color: #e0e0e0;
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
}
.header {
  text-align: center;
  margin-bottom: 40px;
}
.header h1 {
  font-size: 1.1rem;
  color: #666;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.header .sub {
  color: #444;
  font-size: .78rem;
}
.badge-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 40px;
}
.badge {
  font-size: 4rem;
  font-weight: 900;
  letter-spacing: 8px;
  padding: 24px 56px;
  border-radius: 16px;
  border: 2px solid #f1c40f;
  color: #f1c40f;
  background: rgba(241,196,15,0.12);
  margin-bottom: 12px;
}
.badge-label {
  color: #f1c40f;
  font-size: .9rem;
  letter-spacing: 1px;
}
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  width: 100%;
  max-width: 640px;
  margin-bottom: 40px;
}
.info-item {
  background: #111128;
  border: 1px solid #1e1e3e;
  border-radius: 12px;
  padding: 18px;
  text-align: center;
}
.info-label {
  font-size: .72rem;
  color: #555;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.info-value {
  font-size: 1.3rem;
  font-weight: bold;
  color: #ccc;
}
.info-value.green { color: #2ecc71; }
.info-value.red   { color: #e74c3c; }
.chart-wrap {
  width: 100%;
  max-width: 640px;
  background: #111128;
  border: 1px solid #1e1e3e;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
}
.chart-title {
  font-size: .75rem;
  color: #555;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.footer {
  color: #333;
  font-size: .72rem;
  text-align: center;
  margin-top: 8px;
}
@media (max-width: 480px) {
  .badge { font-size: 2.8rem; padding: 18px 36px; letter-spacing: 4px; }
}
</style>
</head>
