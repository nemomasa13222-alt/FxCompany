<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>逆張り否定ラボ｜USDJPY M1</title>
  <script src="../tick_replay/vendor/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{--bg:#eef4f6;--paper:#fff;--ink:#102431;--muted:#657987;--line:#d5e2e7;--teal:#0caaa0;--teal-deep:#08756f;--cyan:#0dcde0;--orange:#f3a512;--red:#df5260;--violet:#7358d8;--navy:#123848;--shadow:0 9px 28px rgba(31,66,82,.09)}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.45;overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.page{max-width:980px;margin:auto;padding:12px 12px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 2px 8px}.top h1{font-size:21px;margin:0}.top p{font-size:11px;color:var(--muted);margin:2px 0 0}.separate{font-size:10px;font-weight:850;color:var(--teal-deep);background:#dff6f3;border-radius:999px;padding:6px 9px;white-space:nowrap}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:13px;margin-top:10px}.setup{display:grid;grid-template-columns:1fr 1fr 1.25fr auto;gap:8px;align-items:end}.field{min-width:0}.field label{display:block;font-size:10px;color:var(--muted);margin:0 0 4px}.field select{width:100%;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;color:var(--ink)}.primary,.secondary,.danger{border:0;border-radius:10px;min-height:42px;padding:9px 14px;font-weight:850}.primary{background:var(--teal);color:#fff}.secondary{background:#eaf1f4;color:#294553}.danger{background:#fff0f1;color:#b22c3d}.primary:disabled,.secondary:disabled{opacity:.42}.monthStats{display:flex;gap:16px;margin-top:9px;color:var(--muted);font-size:11px}.monthStats b{color:var(--ink);font-size:14px;margin-left:3px}
    .workbench{scroll-margin-top:6px;padding:10px}.phaseRail{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:8px}.phase{position:relative;padding:7px 8px;border-radius:9px;background:#eef3f5;color:#758691;font-size:10px;font-weight:800;text-align:center}.phase.active{background:#dcf7f4;color:#08766f;box-shadow:inset 0 0 0 1px #78d9d2}.phase.done{background:#173e4d;color:#fff}.chartShell{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}#chart{height:clamp(300px,46svh,430px);width:100%;touch-action:pan-y}.replay{display:grid;grid-template-columns:auto auto 1fr auto;gap:7px;align-items:center;margin-top:8px}.replay button{border:0;border-radius:9px;min-height:40px;padding:8px 12px;background:#e8f0f3;color:#294553;font-weight:850}.replay input{width:100%}.replay select{height:40px;border:1px solid var(--line);border-radius:9px;background:#fff}.status{min-height:18px;margin:5px 2px 0;font-size:11px;color:var(--muted)}.status.ok{color:var(--teal-deep)}.status.error{color:#b42335}
    .capture{margin-top:8px;border-radius:12px;background:#f4f8fa;border:1px solid #dce7eb;padding:9px}.captureTitle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:7px}.captureTitle b{font-size:13px;color:var(--ink)}.evidenceButtons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.markButton{border:1px solid;min-height:56px;border-radius:11px;padding:8px;font-weight:900;line-height:1.25}.markButton small{display:block;font-weight:700;font-size:10px;margin-top:3px}.markButton.long{background:#e3faf7;border-color:#54d1c8;color:#08756f}.markButton.short{background:#fff1e0;border-color:#f0bd6a;color:#8a5200}.pending{display:none;gap:8px}.pending.show{display:grid}.pendingText{min-width:0}.pendingText b{display:block;font-size:14px}.pendingText span{display:block;font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.candidateNav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.candidateNav button{border:1px solid #cbdadd;border-radius:8px;background:#fff;color:#294b58;min-height:36px;font-size:11px;font-weight:850}.entryActions{display:grid;grid-template-columns:1fr auto;gap:6px}.entryButton{border:0;border-radius:10px;min-height:48px;padding:8px 13px;color:#fff;font-weight:900}.entryButton.long{background:var(--teal)}.entryButton.short{background:var(--red)}.resetButton{border:0;border-radius:10px;background:#e5edef;color:#425a66;padding:8px 10px;font-weight:800}
    details.extra{margin-top:7px;border-top:1px dashed #ccdade;padding-top:6px}details.extra summary{font-size:11px;color:#526975;cursor:pointer}.extraGrid{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:8px}.strength{display:flex;gap:5px}.pill{position:relative}.pill input{position:absolute;opacity:0}.pill span{display:inline-flex;padding:6px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:10px}.pill input:checked+span{background:#dff7f4;border-color:var(--teal);color:var(--teal-deep);font-weight:850}.reasonRow{display:flex;flex-wrap:wrap;gap:5px}.memo{width:100%;grid-column:1/3;border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-height:42px;resize:vertical;font-size:11px}
    .savedHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.savedHead h2{font-size:15px;margin:0}.finish{border:0;border-radius:9px;background:var(--navy);color:#fff;padding:8px 11px;font-size:11px;font-weight:850}.finish.done{background:var(--teal-deep)}.list{display:grid;gap:7px;margin-top:9px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}.dir{border-radius:8px;padding:6px 8px;font-weight:900;font-size:11px}.dir.long{background:#ddf8f5;color:#08756f}.dir.short{background:#fff0e0;color:#8a5200}.item b{display:block;font-size:12px}.item span{display:block;color:var(--muted);font-size:10px}.item button{border:0;border-radius:8px;background:#fff0f1;color:#b22c3d;padding:6px 8px;font-size:10px;font-weight:800}.empty{padding:12px;text-align:center;color:var(--muted);font-size:11px;border:1px dashed var(--line);border-radius:9px}
    @media(max-width:700px){.page{width:100%;max-width:100%;padding:9px 8px 42px}.top{align-items:flex-start}.top h1{font-size:18px}.top p{font-size:10px;max-width:270px}.separate{display:none}.card,.workbench,.chartShell,#chart{width:100%;max-width:100%;min-width:0;overflow:hidden}.setup{grid-template-columns:minmax(0,1fr)}.setup .session,.setup .primary{grid-column:1}.monthStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.monthStats span{text-align:center}.workbench{padding:8px;min-height:calc(100svh - 14px)}.phaseRail{grid-template-columns:repeat(3,minmax(0,1fr))}.phase{min-width:0;padding:6px 2px;font-size:8px;overflow-wrap:anywhere}#chart{height:clamp(300px,43svh,390px)}.replay{grid-template-columns:auto auto minmax(0,1fr)}.replay select{grid-column:1/4;width:100%;height:36px}.capture{padding:8px}.markButton{min-height:54px;font-size:12px}.pending.show{grid-template-columns:1fr}.entryActions{display:grid;grid-template-columns:minmax(0,1fr) auto}.entryButton{min-height:50px}.extraGrid{grid-template-columns:1fr}.memo{grid-column:1}.card{border-radius:12px}.item{grid-template-columns:auto minmax(0,1fr)}.item button{grid-column:1/3;width:100%}}
  </style>
</head>
<body>
<main class="page">
  <header class="top"><div><h1>逆張り否定ラボ　USDJPY M1</h1><p>逆張りの証拠と、その否定後のエントリーだけを2点で記録します。</p></div><span class="separate">通常デモとは別保存</span></header>

  <section class="card">
    <div class="setup">
      <div class="field"><label>対象月</label><select id="monthSel"></select></div>
      <div class="field"><label>対象日</label><select id="dateSel"></select></div>
      <div class="field session"><label>表示時間</label><select id="sessionSel"><option value="09:00|24:00">9時〜24時</option><option value="09:00|12:00">9時〜12時</option><option value="12:00|16:00">12時〜16時</option><option value="16:00|20:00">16時〜20時</option><option value="20:00|24:00">20時〜24時</option><option value="00:00|24:00">終日</option></select></div>
      <button class="primary" id="loadBtn">この日を読み込む</button>
    </div>
    <div class="monthStats"><span>確認済み <b id="reviewedMetric">0 / 0</b></span><span>今月 <b id="monthMetric">0件</b></span><span>この日 <b id="dayMetric">0件</b></span></div>
  </section>

  <section class="card workbench" id="workbench">
    <div class="phaseRail"><div class="phase active" id="phase1">1　エントリーを記録</div><div class="phase" id="phase2">2　過去の逆張りを探す</div><div class="phase" id="phase3">3　2点を保存</div></div>
    <div class="chartShell">
      <div id="chart"></div>
    </div>
    <div class="replay"><button id="playBtn" disabled>▶ 再生</button><button id="stepBtn" disabled>＋1分</button><input id="seekBar" type="range" min="0" max="1000" value="0" disabled><select id="speedSel"><option value="1">実速</option><option value="10">10倍</option><option value="60" selected>60倍</option><option value="300">300倍</option><option value="max">最速</option></select></div>
    <div class="status" id="status">データ一覧を確認中...</div>

    <div class="capture">
      <div class="captureTitle"><b id="captureHeading">現在足を「エントリー」として記録</b><span id="captureHint">逆張りは後から選択</span></div>
      <div class="evidenceButtons" id="evidenceButtons">
        <button class="markButton long" id="longEvidence" disabled>↑ LONGエントリー<small>現在足を先に記録</small></button>
        <button class="markButton short" id="shortEvidence" disabled>↓ SHORTエントリー<small>現在足を先に記録</small></button>
      </div>
      <div class="pending" id="pendingPanel">
        <div class="pendingText"><b id="pendingTitle">--</b><span id="pendingMeta">--</span></div>
        <div class="candidateNav"><button data-move="-10">−10分</button><button data-move="-1">−1分</button><button data-move="1">＋1分</button><button data-move="10">＋10分</button></div>
        <div class="entryActions"><button class="entryButton" id="entryBtn">選択中の足を逆張りとして2点保存</button><button class="resetButton" id="resetBtn">やり直す</button></div>
      </div>
      <details class="extra"><summary>強さ・根拠・メモを追加（任意）</summary><div class="extraGrid">
        <div class="strength"><label class="pill"><input type="radio" name="strength" value="weak"><span>弱い</span></label><label class="pill"><input type="radio" name="strength" value="normal" checked><span>普通</span></label><label class="pill"><input type="radio" name="strength" value="strong"><span>強い</span></label></div>
        <div class="reasonRow" id="reasonChips"><label class="pill"><input type="checkbox" value="long_wick"><span>長い髭</span></label><label class="pill"><input type="checkbox" value="round_number"><span>キリ番</span></label><label class="pill"><input type="checkbox" value="recent_extreme"><span>直近高安</span></label><label class="pill"><input type="checkbox" value="h1_extreme"><span>H1高安</span></label><label class="pill"><input type="checkbox" value="rapid_move"><span>急騰急落</span></label><label class="pill"><input type="checkbox" value="repeated_rejection"><span>複数反発</span></label></div>
        <textarea class="memo" id="noteInput" maxlength="240" placeholder="任意メモ"></textarea>
      </div></details>
    </div>
  </section>

  <section class="card">
    <div class="savedHead"><h2>この日に登録したエントリー</h2><button class="finish" id="completeBtn" disabled>この日の確認を完了</button></div>
    <div class="list" id="sequenceList"><div class="empty">まだ登録されていません。</div></div>
  </section>
</main>

<script>
const PAIR='USDJPY', JST=9*60*60*1000;
const API='https://tick-replay-results-api.nemomasa01222.workers.dev';
const TOKEN_KEY='tickReplayDeviceToken_v1';
const STATE_KEY='countertrendReviewState_v1';
let manifest=null,TICKS=[],BARS=[],N=0,curIdx=-1,curBarId=-1,chart=null,series=null,smaSeries=null;
let o=0,h=0,l=0,c=0,playing=false,lastFrame=null,simMs=0,currentDate='',rangeStart='',rangeEnd='';
let entryPoint=null,evidence=null,candidateIndex=-1,direction='',monthSequences=[],reviewedDays=[];
let lastStateWrite=0;
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
function setStatus(t,k=''){const e=$('status');e.textContent=t;e.className='status '+k}
function jstEpoch(v){return Date.parse(v+':00+09:00')}
function jstMinute(ms){const d=new Date(ms+JST);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`}
function jstDisplay(ms){return jstMinute(ms).replace('T',' ')}
function addDays(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function monthBounds(m){const [y,n]=m.split('-').map(Number),from=Date.parse(`${m}-01T00:00:00+09:00`),next=n===12?`${y+1}-01`:`${y}-${pad(n+1)}`;return{from,to:Date.parse(`${next}-01T00:00:00+09:00`)}}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function readState(){try{return JSON.parse(localStorage.getItem(STATE_KEY)||'null')}catch{return null}}
function saveState(force=false){if(!currentDate||!N)return;const now=Date.now();if(!force&&now-lastStateWrite<2000)return;lastStateWrite=now;localStorage.setItem(STATE_KEY,JSON.stringify({month:$('monthSel').value,date:$('dateSel').value,session:$('sessionSel').value,tick_epoch_ms:TICKS[curIdx]?.t||null,direction,entry_point:entryPoint,evidence,candidate_index:candidateIndex}))}
function nearestTickIndex(epoch){let lo=0,hi=N-1,best=0;while(lo<=hi){const mid=(lo+hi)>>1;if(TICKS[mid].t<=epoch){best=mid;lo=mid+1}else hi=mid-1}return best}

function ensureChart(){if(chart)return;chart=LightweightCharts.createChart($('chart'),{autoSize:true,layout:{background:{color:'#fff'},textColor:'#263746'},grid:{vertLines:{color:'#edf2f4'},horzLines:{color:'#edf2f4'}},timeScale:{timeVisible:true,secondsVisible:false,borderColor:'#d5e0e5'},rightPriceScale:{borderColor:'#d5e0e5',scaleMargins:{top:.12,bottom:.1}},handleScroll:{vertTouchDrag:false}});series=chart.addCandlestickSeries({upColor:'#20a89e',downColor:'#e85360',borderUpColor:'#20a89e',borderDownColor:'#e85360',wickUpColor:'#20a89e',wickDownColor:'#e85360',priceFormat:{type:'price',precision:3,minMove:.001},title:'USDJPY'});smaSeries=chart.addLineSeries({color:'#0cc8dc',lineWidth:2,priceLineVisible:false,lastValueVisible:true,title:'SMA75'})}
async function fetchDay(d){const r=await fetch(`../tick_replay/data/USDJPY/${d}.json`,{cache:'no-store'});return r.ok?r.json():null}
function monthDates(m){return manifest.dates.filter(d=>d.startsWith(m)&&d>='2026-01-01'&&d<='2026-10-31')}
function populateMonths(){const ms=[...new Set(manifest.dates.filter(d=>d>='2026-01-01'&&d<='2026-10-31').map(d=>d.slice(0,7)))];$('monthSel').innerHTML=ms.map(m=>`<option value="${m}">${m.replace('-','年')}月</option>`).join('');$('monthSel').value=ms.includes('2026-01')?'2026-01':ms[0];populateDates()}
function populateDates(){const ds=monthDates($('monthSel').value),old=$('dateSel').value;$('dateSel').innerHTML=ds.map(d=>`<option value="${d}">${d}</option>`).join('');if(ds.includes(old))$('dateSel').value=old;updateMetrics()}
function sessionRange(){const d=$('dateSel').value,[a,b]=$('sessionSel').value.split('|'),start=`${d}T${a}`,end=b==='24:00'?`${addDays(d,1)}T00:00`:`${d}T${b}`;return{date:d,start,end,startMs:jstEpoch(start),endMs:jstEpoch(end)}}
function makeBars(ticks){const out=[];let minute=null,bar=null;for(let i=0;i<ticks.length;i++){const t=Math.floor((ticks[i].t+JST)/60000)*60;if(t!==minute){bar={t,o:ticks[i].m,h:ticks[i].m,l:ticks[i].m,c:ticks[i].m,s:i,i:out.length};out.push(bar);minute=t}else{bar.h=Math.max(bar.h,ticks[i].m);bar.l=Math.min(bar.l,ticks[i].m);bar.c=ticks[i].m}ticks[i].g=out.length-1}return out}
const barData=b=>({time:b.t,open:b.o,high:b.h,low:b.l,close:b.c});
function smaData(limit){const data=[],w=[];let sum=0;for(let i=0;i<=limit&&i<BARS.length;i++){w.push(BARS[i].c);sum+=BARS[i].c;if(w.length>75)sum-=w.shift();if(w.length===75)data.push({time:BARS[i].t,value:sum/75})}return data}

async function loadRange(scroll=true,restore=null){if(!manifest)return;stop();entryPoint=null;evidence=null;candidateIndex=-1;direction='';const r=sessionRange();currentDate=r.date;rangeStart=r.start;rangeEnd=r.end;setStatus('ティックデータを読み込み中...');$('loadBtn').disabled=true;try{const dates=[],pos=manifest.dates.indexOf(r.date);if(pos>0)dates.push(manifest.dates[pos-1]);dates.push(r.date);if(r.end.slice(0,10)!==r.date&&manifest.dates.includes(r.end.slice(0,10)))dates.push(r.end.slice(0,10));const ps=await Promise.all([...new Set(dates)].map(fetchDay)),ticks=[];for(const p of ps.filter(Boolean))for(let i=0;i<p.t.length;i++)if(p.t[i]>=r.startMs&&p.t[i]<r.endMs){const b=p.b[i],a=p.a[i];ticks.push({t:p.t[i],b,a,m:Math.round((b+a)/2*1000)/1000})}ticks.sort((a,b)=>a.t-b.t);if(!ticks.length)throw new Error('この時間帯にはティックがありません');TICKS=ticks;N=ticks.length;BARS=makeBars(TICKS);ensureChart();series.setData([]);smaSeries.setData([]);curIdx=-1;curBarId=-1;const canRestore=restore&&restore.date===r.date&&restore.session===$('sessionSel').value;seekTo(canRestore&&restore.tick_epoch_ms?nearestTickIndex(restore.tick_epoch_ms):0);chart.timeScale().fitContent();if(canRestore&&restore.entry_point&&restore.evidence&&restore.direction){entryPoint=restore.entry_point;evidence=restore.evidence;direction=restore.direction;candidateIndex=Math.max(0,Math.min(entryPoint.barIndex-1,Number(restore.candidate_index)||0));setReplayEnabled(false)}else setReplayEnabled(true);renderCapture();refreshMarkers();$('completeBtn').disabled=false;setStatus(`${r.start.replace('T',' ')}〜${r.end.replace('T',' ')}　${N.toLocaleString()}ティック${canRestore&&restore.tick_epoch_ms?'｜前回位置を復元':''}`,'ok');renderSequences();updateMetrics();saveState(true);if(scroll)$('workbench').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){setStatus(e.message||'読み込みに失敗しました','error')}finally{$('loadBtn').disabled=false}}
function seekTo(index){if(!N)return;index=Math.max(0,Math.min(N-1,index));const g=TICKS[index].g;series.setData(BARS.slice(0,g).map(barData));const start=BARS[g].s;o=TICKS[start].m;h=o;l=o;c=o;for(let i=start;i<=index;i++){const m=TICKS[i].m;h=Math.max(h,m);l=Math.min(l,m);c=m}curIdx=index;curBarId=g;series.update({time:BARS[g].t,open:o,high:h,low:l,close:c});smaSeries.setData(smaData(g));simMs=TICKS[index].t-TICKS[0].t;renderTick();refreshMarkers()}
function applyTick(i){const tk=TICKS[i],g=tk.g;if(g!==curBarId){curBarId=g;o=tk.m;h=o;l=o;c=o}else{h=Math.max(h,tk.m);l=Math.min(l,tk.m);c=tk.m}curIdx=i;series.update({time:BARS[g].t,open:o,high:h,low:l,close:c});if(g!==TICKS[Math.max(0,i-1)].g)smaSeries.setData(smaData(g));renderTick()}
function renderTick(){$('seekBar').value=N>1?Math.round(curIdx/(N-1)*1000):0;saveState(false)}
function play(){if(!N)return;if(playing){stop();return}playing=true;lastFrame=null;$('playBtn').textContent='Ⅱ 一時停止';requestAnimationFrame(frame)}
function stop(){playing=false;$('playBtn').textContent='▶ 再生';lastFrame=null;saveState(true)}
function frame(now){if(!playing)return;const dt=lastFrame===null?0:now-lastFrame;lastFrame=now;const speed=$('speedSel').value;if(speed==='max')seekTo(Math.min(N-1,curIdx+1800));else{simMs+=dt*Number(speed);const target=TICKS[0].t+simMs;let i=curIdx+1;while(i<N&&TICKS[i].t<=target){applyTick(i);i++}}if(curIdx>=N-1){stop();return}requestAnimationFrame(frame)}
function stepMinute(){if(!N)return;stop();const target=TICKS[curIdx].t+60000;let i=curIdx+1;while(i<N&&TICKS[i].t<target)i++;seekTo(Math.min(N-1,i))}
function snapshot(){if(curIdx<0)return null;return{epoch:TICKS[curIdx].t,time:jstMinute(TICKS[curIdx].t),chartTime:BARS[curBarId].t,barIndex:curBarId,open:o,high:h,low:l,close:c}}
function barSnapshot(index){const b=BARS[index];if(!b)return null;const epoch=b.t*1000-JST;return{epoch,time:jstMinute(epoch),chartTime:b.t,barIndex:index,open:b.o,high:b.h,low:b.l,close:b.c}}
function setReplayEnabled(on){$('playBtn').disabled=!on;$('stepBtn').disabled=!on;$('seekBar').disabled=!on}
function captureEntry(dir){stop();const s=snapshot();if(!s||s.barIndex<1){setStatus('少し再生してからエントリーを記録してください','error');return}direction=dir;entryPoint=s;candidateIndex=Math.max(0,s.barIndex-5);evidence=barSnapshot(candidateIndex);setReplayEnabled(false);renderCapture();refreshMarkers();saveState(true)}
function moveCandidate(delta){if(!entryPoint)return;candidateIndex=Math.max(0,Math.min(entryPoint.barIndex-1,candidateIndex+delta));evidence=barSnapshot(candidateIndex);renderCapture();refreshMarkers();saveState(true)}
function resetDraft(){entryPoint=null;evidence=null;candidateIndex=-1;direction='';if(N)setReplayEnabled(true);renderCapture();refreshMarkers();saveState(true)}
function renderCapture(){const reviewing=Boolean(entryPoint);$('evidenceButtons').style.display=reviewing?'none':'grid';$('pendingPanel').classList.toggle('show',reviewing);$('longEvidence').disabled=!N;$('shortEvidence').disabled=!N;$('phase1').className='phase '+(reviewing?'done':'active');$('phase2').className='phase '+(reviewing?'active':'');$('phase3').className='phase '+(reviewing?'active':'');if(!reviewing){$('captureHeading').textContent='現在足を「エントリー」として記録';$('captureHint').textContent='逆張りは後から選択';return}const isLong=direction==='long';$('captureHeading').textContent='過去の逆張り足をボタンで選択';$('captureHint').textContent='ドラッグ不要｜2点間は自動解析';$('pendingTitle').textContent=`${isLong?'LONG':'SHORT'}エントリー ${entryPoint.time.replace('T',' ')}｜逆張り候補 ${evidence.time.replace('T',' ')}`;$('pendingMeta').textContent=`候補 O ${evidence.open.toFixed(3)} / H ${evidence.high.toFixed(3)} / L ${evidence.low.toFixed(3)} / C ${evidence.close.toFixed(3)}`;$('entryBtn').className='entryButton '+direction;$('entryBtn').textContent=`この足を逆張りとして${isLong?'LONG':'SHORT'}を保存`}
function reasons(){return[...document.querySelectorAll('#reasonChips input:checked')].map(x=>x.value)}
function strength(){return document.querySelector('input[name=strength]:checked')?.value||'normal'}

async function registerDevice(){const code=prompt('この端末を登録する数字コードを入力してください');if(!code)return'';const r=await fetch(`${API}/api/register-device`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,label:'逆張り否定ラボ'})}),j=await r.json();if(!r.ok||!j.token)throw new Error(j.error||'端末登録に失敗しました');localStorage.setItem(TOKEN_KEY,j.token);return j.token}
async function token(required=false){let t=localStorage.getItem(TOKEN_KEY)||'';if(!t&&required)t=await registerDevice();return t}
async function apiFetch(path,opt={},required=true){let t=await token(required);if(!t)throw new Error('端末登録が必要です');let r=await fetch(API+path,{...opt,headers:{...(opt.headers||{}),Authorization:`Bearer ${t}`}});if(r.status===401&&required){localStorage.removeItem(TOKEN_KEY);t=await registerDevice();r=await fetch(API+path,{...opt,headers:{...(opt.headers||{}),Authorization:`Bearer ${t}`}})}return r}
async function loadMonthRecords(required=false){try{if(!localStorage.getItem(TOKEN_KEY)&&!required){monthSequences=[];reviewedDays=[];updateMetrics();return}const b=monthBounds($('monthSel').value),r=await apiFetch(`/api/countertrend-sequences?from=${b.from}&to=${b.to}`,{},required),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'保存済み記録を取得できません');monthSequences=j.sequences||[];reviewedDays=j.reviewed_days||[];renderSequences();refreshMarkers();updateMetrics()}catch(e){setStatus(e.message||'保存済み記録を取得できません','error')}}
async function saveSequence(){stop();if(!evidence||!entryPoint)return;$('entryBtn').disabled=true;const body={pair:PAIR,session_date:currentDate,range_start_jst:rangeStart,range_end_jst:rangeEnd,direction,evidence_epoch_ms:evidence.epoch,evidence_time_jst:evidence.time,evidence:{open:evidence.open,high:evidence.high,low:evidence.low,close:evidence.close},entry_epoch_ms:entryPoint.epoch,entry_time_jst:entryPoint.time,entry:{open:entryPoint.open,high:entryPoint.high,low:entryPoint.low,close:entryPoint.close},strength:strength(),reasons:reasons(),note:$('noteInput').value};try{const r=await apiFetch('/api/countertrend-sequences',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)},true),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'保存できません');const i=monthSequences.findIndex(x=>x.id===j.sequence.id);if(i>=0)monthSequences[i]=j.sequence;else monthSequences.push(j.sequence);setStatus(`${j.sequence.entry_time_jst.replace('T',' ')}のエントリーを保存しました`,'ok');$('noteInput').value='';document.querySelectorAll('#reasonChips input').forEach(x=>x.checked=false);resetDraft();renderSequences();updateMetrics()}catch(e){setStatus(e.message||'保存できません','error')}finally{$('entryBtn').disabled=false}}
async function deleteSequence(id){if(!confirm('このエントリー記録を削除しますか？'))return;try{const r=await apiFetch('/api/countertrend-sequences/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sequence_id:id})},true),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'削除できません');monthSequences=monthSequences.filter(x=>x.id!==id);renderSequences();refreshMarkers();updateMetrics();setStatus('記録を削除しました','ok')}catch(e){setStatus(e.message||'削除できません','error')}}
async function completeDay(){try{const r=await apiFetch('/api/countertrend-review-days',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_date:currentDate,range_start_jst:rangeStart,range_end_jst:rangeEnd})},true),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'完了を保存できません');const i=reviewedDays.findIndex(x=>x.session_date===currentDate),row={session_date:currentDate,range_start_jst:rangeStart,range_end_jst:rangeEnd,completed_at:j.completed_at};if(i>=0)reviewedDays[i]=row;else reviewedDays.push(row);updateMetrics();setStatus(`${currentDate}を確認済みにしました`,'ok')}catch(e){setStatus(e.message||'完了を保存できません','error')}}

function daySequences(){if(!rangeStart||!rangeEnd)return[];const a=jstEpoch(rangeStart),b=jstEpoch(rangeEnd);return monthSequences.filter(x=>x.evidence_epoch_ms>=a&&x.evidence_epoch_ms<b)}
function renderSequences(){const rows=daySequences().sort((a,b)=>a.evidence_epoch_ms-b.evidence_epoch_ms);if(!rows.length){$('sequenceList').innerHTML='<div class="empty">まだ登録されていません。該当なしでも確認完了を保存できます。</div>';return}$('sequenceList').innerHTML=rows.map(x=>`<div class="item"><span class="dir ${x.direction}">${x.direction==='long'?'LONG':'SHORT'}</span><div><b>逆張り ${x.evidence_time_jst.replace('T',' ')} → エントリー ${x.entry_time_jst.replace('T',' ')}</b><span>${x.direction==='long'?'高値の売り逆張りを否定':'安値の買い逆張りを否定'}${x.note?'｜'+escapeHtml(x.note):''}</span></div><button onclick="deleteSequence('${x.id}')">削除</button></div>`).join('')}
function updateMetrics(){if(!manifest)return;const ds=monthDates($('monthSel').value),done=new Set(reviewedDays.map(x=>x.session_date));$('reviewedMetric').textContent=`${ds.filter(d=>done.has(d)).length} / ${ds.length}`;$('monthMetric').textContent=`${monthSequences.length}件`;$('dayMetric').textContent=`${daySequences().length}件`;const d=done.has(currentDate);$('completeBtn').classList.toggle('done',d);$('completeBtn').textContent=d?'この日は確認済み':'この日の確認を完了'}
function refreshMarkers(){if(!series||!BARS.length)return;const m=[];for(const x of daySequences()){m.push({time:Math.floor((x.evidence_epoch_ms+JST)/60000),position:x.direction==='long'?'aboveBar':'belowBar',color:'#f3a512',shape:'circle',text:'逆張り'});m.push({time:Math.floor((x.entry_epoch_ms+JST)/60000),position:x.direction==='long'?'belowBar':'aboveBar',color:x.direction==='long'?'#0caaa0':'#df5260',shape:x.direction==='long'?'arrowUp':'arrowDown',text:x.direction==='long'?'LONG':'SHORT'})}if(entryPoint){m.push({time:evidence.chartTime,position:direction==='long'?'aboveBar':'belowBar',color:'#f3a512',shape:'circle',text:'逆張り候補'});m.push({time:entryPoint.chartTime,position:direction==='long'?'belowBar':'aboveBar',color:direction==='long'?'#0caaa0':'#df5260',shape:direction==='long'?'arrowUp':'arrowDown',text:'ENTRY'})}m.sort((a,b)=>a.time-b.time);series.setMarkers(m)}

async function init(){ensureChart();try{const r=await fetch('../tick_replay/data/USDJPY/manifest.json',{cache:'no-store'});if(!r.ok)throw new Error('データ一覧を取得できません');manifest=await r.json();populateMonths();const saved=readState();if(saved?.month&&[...$('monthSel').options].some(o=>o.value===saved.month)){$('monthSel').value=saved.month;populateDates()}if(saved?.date&&[...$('dateSel').options].some(o=>o.value===saved.date))$('dateSel').value=saved.date;if(saved?.session&&[...$('sessionSel').options].some(o=>o.value===saved.session))$('sessionSel').value=saved.session;await loadMonthRecords(false);await loadRange(false,saved)}catch(e){setStatus(e.message||'初期化に失敗しました','error')}}
$('monthSel').addEventListener('change',async()=>{populateDates();monthSequences=[];reviewedDays=[];await loadMonthRecords(false)});$('loadBtn').addEventListener('click',()=>loadRange(true));$('playBtn').addEventListener('click',play);$('stepBtn').addEventListener('click',stepMinute);$('seekBar').addEventListener('input',e=>{if(N)seekTo(Math.round(Number(e.target.value)/1000*(N-1)))});$('seekBar').addEventListener('change',()=>saveState(true));$('longEvidence').addEventListener('click',()=>captureEntry('long'));$('shortEvidence').addEventListener('click',()=>captureEntry('short'));document.querySelectorAll('.candidateNav button').forEach(b=>b.addEventListener('click',()=>moveCandidate(Number(b.dataset.move))));$('entryBtn').addEventListener('click',saveSequence);$('resetBtn').addEventListener('click',resetDraft);$('completeBtn').addEventListener('click',completeDay);window.addEventListener('beforeunload',()=>saveState(true));init();
</script>
</body>
