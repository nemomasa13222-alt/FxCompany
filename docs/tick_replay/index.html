<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ティックリプレイ USDJPY</title>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:"Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;margin:0;background:#eef2f7;color:#1e293b;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h1{font-size:18px;margin:0 0 4px}
.sub{color:#64748b;font-size:13px;margin-bottom:10px}
#chart{width:100%;height:520px;touch-action:pan-y}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.formrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
label{font-size:13px;color:#475569}
.axislabel{font-size:13px;color:#475569}
button{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer;min-height:44px;touch-action:manipulation}
button:hover{background:#1d4ed8}
button:disabled{background:#94a3b8;cursor:default}
button.secondary{background:#64748b}
button.secondary:hover{background:#475569}
button.buy{background:#16a34a}
button.buy:hover{background:#15803d}
button.sell{background:#dc2626}
button.sell:hover{background:#b91c1c}
button.buy:disabled,button.sell:disabled{background:#94a3b8}
button.small{min-height:32px;padding:4px 12px;font-size:12px}
.pnl-pos{color:#16a34a}
.pnl-neg{color:#dc2626}
#tradeCard{display:none}
#historyTable{width:100%;border-collapse:collapse;font-size:12px}
#historyTable th{text-align:left;color:#64748b;padding:4px}
#historyTable td{padding:4px;border-top:1px solid #f1f5f9}
.historyWrap{overflow-x:auto;max-height:260px;overflow-y:auto}
.tradeHeading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tradeHeadingCopy{min-width:0}
.tradeHeadingCopy .sub{margin:3px 0 0}
button.export{background:#0f766e;white-space:nowrap}
button.export:hover{background:#115e59}
.tradeBar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.12);display:none}
.tradeBar.show{display:block}
.tradeBarInner{max-width:1100px;margin:0 auto;padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.tradeBarInfo{flex:0 0 auto;min-width:90px;font-size:12px;color:#64748b;line-height:1.3}
.tradeBarInfo .pnl{font-size:16px;font-weight:700;color:#1e293b;margin-top:2px}
.tradeBarInner button{flex:1;padding:12px 10px;font-size:14px;min-height:46px}
body.has-tradebar{padding-bottom:90px}
select,input[type=datetime-local],input[type=number]{padding:10px;border-radius:8px;border:1px solid #cbd5e1;font-size:15px;min-height:44px;background:#fff;color:#1e293b}
input[type=range]{flex:1;min-width:150px;min-height:32px}
.indicatorBar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 2px;padding:10px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px}
.indicatorToggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:#1e293b;cursor:pointer}
.indicatorToggle input{width:19px;height:19px;accent-color:#0891b2}
.smaSwatch{width:26px;height:3px;border-radius:2px;background:#06b6d4;box-shadow:0 0 0 1px rgba(8,145,178,.08)}
.periodControl{display:inline-flex;align-items:center;gap:7px}
.periodControl input{width:86px;text-align:center;font-variant-numeric:tabular-nums}
.indicatorState{margin-left:auto;color:#64748b;font-size:12px;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{flex:1 1 120px;background:#f1f5f9;border-radius:8px;padding:10px;text-align:center}
.stat .label{font-size:11px;color:#64748b}
.stat .value{font-size:17px;font-weight:600;margin-top:2px}
.progress-label{font-size:12px;color:#64748b;min-width:150px;text-align:right}
.msg{font-size:13px;margin-top:10px}
.msg.error{color:#dc2626}
.msg.warn{color:#d97706}
.msg.info{color:#64748b}
#chartCard{display:none}

@media (max-width: 640px) {
  .wrap{padding:10px}
  .card{padding:14px 14px;border-radius:10px}
  h1{font-size:16px}
  .sub{font-size:12px}
  #chart{height:340px}
  .controls{gap:8px}
  #playBtn, #resetBtn{flex:1 1 45%}
  #zoomTitle, #scaleLockBtn{flex:1 1 100%;text-align:center}
  #zoomSlider{flex:1 1 auto;min-width:100px}
  select{flex:1 1 100%;order:3}
  #seekBar{flex:1 1 100%;order:4}
  .progress-label{flex:1 1 100%;order:5;text-align:center}
  .stats{gap:6px}
  .stat{flex:1 1 45%;padding:8px}
  .stat .value{font-size:15px}
  .formrow{flex-direction:column;align-items:stretch}
  input[type=datetime-local]{width:100%}
  .indicatorBar{gap:9px;padding:9px 10px}
  .indicatorToggle{flex:1 1 auto}
  .indicatorState{flex:1 1 100%;margin-left:0}
  .periodControl input{width:74px}
  .tradeBarInner{padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
  .tradeBarInfo{min-width:64px;font-size:10px}
  .tradeBarInfo .pnl{font-size:13px}
  .tradeBarInner button{padding:10px 4px;font-size:13px;min-height:42px}
  .tradeHeading{align-items:stretch;flex-direction:column}
  #exportReportBtn{width:100%}
  body.has-tradebar{padding-bottom:78px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ティックリプレイ　USDJPY</h1>
    <div class="sub" id="availSub">データ範囲を確認中...</div>
    <div class="formrow">
      <label>指標
        <select id="eventTypeSel"><option value="">選択...</option></select>
      </label>
      <label>該当回
        <select id="eventOccurrenceSel" disabled><option value="">-</option></select>
      </label>
      <button id="eventLoadBtn" class="secondary" disabled>この指標を表示（前30分〜後60分）</button>
    </div>
    <div class="formrow">
      <label>開始 <input type="datetime-local" id="startInput"></label>
      <label>終了 <input type="datetime-local" id="endInput"></label>
      <button id="loadBtn">読み込む</button>
      <button id="latestBtn" class="secondary">最新日を読み込む</button>
      <button id="copyUrlBtn" class="secondary small" type="button" disabled>🔗 URLをコピー</button>
    </div>
    <div class="msg" id="statusMsg"></div>
  </div>

  <div class="card" id="chartCard">
    <div class="sub" id="rangeLabel"></div>
    <div class="indicatorBar" aria-label="チャート指標設定">
      <span class="smaSwatch" aria-hidden="true"></span>
      <label class="indicatorToggle"><input type="checkbox" id="smaToggle" checked> SMAを表示</label>
      <label class="periodControl">期間
        <input type="number" id="smaPeriodInput" min="2" max="500" step="1" value="75" inputmode="numeric" aria-label="SMA期間">
        <span class="axislabel">本</span>
      </label>
      <span class="indicatorState" id="smaState">SMA75｜過去75本の終値平均</span>
    </div>
    <div id="chart"></div>
    <div class="controls">
      <span class="axislabel" id="zoomTitle">縦軸ズーム</span>
      <span class="axislabel">広い</span>
      <input type="range" id="zoomSlider" min="2" max="40" value="10">
      <span class="axislabel">狭い</span>
      <button id="scaleLockBtn" class="secondary" type="button">🔓 自動追従</button>
    </div>
    <div class="controls">
      <button id="playBtn">▶ 再生</button>
      <button id="resetBtn" class="secondary">⏮ 最初から</button>
      <select id="speedSel">
        <option value="1">1x（実速度）</option>
        <option value="5">5x</option>
        <option value="20" selected>20x</option>
        <option value="60">60x</option>
        <option value="300">300x</option>
        <option value="1500">1500x</option>
        <option value="max">MAX（瞬間）</option>
      </select>
      <input type="range" id="seekBar" min="0" max="1000" value="0">
      <span class="progress-label" id="progressLabel">0 / 0</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="label">現在時刻(JST)</div><div class="value" id="curTime">-</div></div>
      <div class="stat"><div class="label">BID</div><div class="value" id="curBid">-</div></div>
      <div class="stat"><div class="label">ASK</div><div class="value" id="curAsk">-</div></div>
      <div class="stat"><div class="label">スプレッド</div><div class="value" id="curSpread">-</div></div>
      <div class="stat"><div class="label">形成中バー O/H/L/C</div><div class="value" id="curBar">-</div></div>
    </div>
  </div>

  <div class="card" id="tradeCard">
    <div class="tradeHeading">
      <div class="tradeHeadingCopy">
        <h1>デモ売買</h1>
        <div class="sub">現在のチャート範囲にある決済済み取引を出力します</div>
      </div>
      <button id="exportReportBtn" class="export" type="button" disabled>分析レポート出力</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="label">ポジション</div><div class="value" id="posStatus">ポジションなし</div></div>
      <div class="stat"><div class="label">エントリー</div><div class="value" id="posEntry">-</div></div>
      <div class="stat"><div class="label">含み損益</div><div class="value" id="posPnl">-</div></div>
    </div>
    <div class="stats" style="margin-top:8px">
      <div class="stat"><div class="label">取引数</div><div class="value" id="histCount">0</div></div>
      <div class="stat"><div class="label">勝率</div><div class="value" id="histWinRate">-</div></div>
      <div class="stat"><div class="label">合計pips</div><div class="value" id="histTotalPips">0.0</div></div>
    </div>
    <div class="sub" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
      <span>取引履歴</span>
      <button id="clearHistBtn" class="secondary small" type="button">履歴クリア</button>
    </div>
    <div class="historyWrap">
      <table id="historyTable">
        <thead>
          <tr><th>決済時刻</th><th>方向</th><th>エントリー</th><th>決済</th><th>pips</th></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="tradeBar" id="tradeBar">
  <div class="tradeBarInner">
    <div class="tradeBarInfo">
      <div id="barStatus">ポジションなし</div>
      <div class="pnl" id="barPnl">-</div>
    </div>
    <button id="barSellBtn" class="sell">SELL</button>
    <button id="barBuyBtn" class="buy">BUY</button>
    <button id="barCloseBtn" class="secondary" disabled>決済</button>
  </div>
</div>

<script>
const PAIR = 'USDJPY';
const SOFT_CAP = 400000;
const HARD_CAP = 1500000;
const JST_OFFSET_MS = 9 * 3600 * 1000;

let manifest = null;
let BARS = [], TICKS = [], N = 0;
let curIdx = -1, curBarId = -1;
let o=0,h=0,l=0,c=0;
let playing = false;
let simMs = 0;
let lastFrameTs = null;
let chart = null, series = null, smaSeries = null;
let priceMargin = 0.1;
let pendingEventMarker = null; // { epoch, label } イベントプルダウンから読み込んだ時だけセット
let activeEventMarker = null;
let autoScaleOn = true;
let smaOn = true;
let smaPeriod = 75;
let SMA_WARMUP_CLOSES = [];
let SMA_PREFIX = [];
let SMA_BY_BAR = [];

let position = null; // { dir: 'buy'|'sell', entryPrice, entryTime }
let positionLine = null;
let tradeHistory = [];
const HISTORY_KEY = 'tickReplayTradeHistory_' + PAIR;

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    tradeHistory = raw ? JSON.parse(raw) : [];
  } catch (e) {
    tradeHistory = [];
  }
}

function saveHistory() {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(tradeHistory)); } catch (e) {}
}

function currentReplayEpoch() {
  if (!TICKS.length) return null;
  const idx = Math.max(0, Math.min(curIdx, TICKS.length - 1));
  return TICKS[idx].t;
}

function visibleTrades() {
  if (!TICKS.length) return [];
  const from = TICKS[0].t;
  const to = currentReplayEpoch();
  return tradeHistory
    .map((trade, index) => ({ ...trade, historyIndex: index + 1 }))
    .filter(trade => trade.entryTime >= from && trade.exitTime <= to);
}

function refreshChartMarkers() {
  const exportBtn = document.getElementById('exportReportBtn');
  const trades = visibleTrades();
  if (exportBtn) exportBtn.disabled = trades.length === 0;
  if (!series || !BARS.length || !TICKS.length) return;

  const markers = activeEventMarker ? [activeEventMarker] : [];
  for (const trade of trades) {
    const entryTime = nearestBarTime(Math.floor((trade.entryTime + JST_OFFSET_MS) / 60000) * 60);
    const exitTime = nearestBarTime(Math.floor((trade.exitTime + JST_OFFSET_MS) / 60000) * 60);
    if (entryTime != null) {
      markers.push({
        time: entryTime,
        position: trade.dir === 'buy' ? 'belowBar' : 'aboveBar',
        color: trade.dir === 'buy' ? '#16a34a' : '#dc2626',
        shape: trade.dir === 'buy' ? 'arrowUp' : 'arrowDown',
        text: `${trade.dir === 'buy' ? 'BUY' : 'SELL'} ${trade.historyIndex}`,
      });
    }
    if (exitTime != null) {
      markers.push({
        time: exitTime,
        position: trade.dir === 'buy' ? 'aboveBar' : 'belowBar',
        color: trade.pips >= 0 ? '#16a34a' : '#dc2626',
        shape: 'circle',
        text: `決済 ${(trade.pips >= 0 ? '+' : '') + trade.pips.toFixed(1)}p`,
      });
    }
  }
  if (position && position.entryTime >= TICKS[0].t && position.entryTime <= currentReplayEpoch()) {
    const entryTime = nearestBarTime(Math.floor((position.entryTime + JST_OFFSET_MS) / 60000) * 60);
    if (entryTime != null) markers.push({
      time: entryTime,
      position: position.dir === 'buy' ? 'belowBar' : 'aboveBar',
      color: position.dir === 'buy' ? '#16a34a' : '#dc2626',
      shape: position.dir === 'buy' ? 'arrowUp' : 'arrowDown',
      text: `${position.dir === 'buy' ? 'BUY' : 'SELL'} 保有中`,
    });
  }
  markers.sort((a, b) => a.time - b.time);
  series.setMarkers(markers);
}

function updateTradeButtons() {
  document.getElementById('barBuyBtn').disabled = !!position;
  document.getElementById('barSellBtn').disabled = !!position;
  document.getElementById('barCloseBtn').disabled = !position;
}

function addPositionLine(dir, entryPrice) {
  removePositionLine();
  positionLine = series.createPriceLine({
    price: entryPrice,
    color: dir === 'buy' ? '#16a34a' : '#dc2626',
    lineWidth: 2,
    lineStyle: LightweightCharts.LineStyle.Dashed,
    axisLabelVisible: true,
    title: dir === 'buy' ? 'BUY' : 'SELL',
  });
}

function removePositionLine() {
  if (positionLine) {
    series.removePriceLine(positionLine);
    positionLine = null;
  }
}

function openPosition(dir) {
  if (position || curIdx < 0) return;
  const tk = TICKS[curIdx];
  position = { dir, entryPrice: dir === 'buy' ? tk.a : tk.b, entryTime: tk.t };
  addPositionLine(position.dir, position.entryPrice);
  updateTradeButtons();
  renderPositionStatus(curIdx);
  refreshChartMarkers();
}

function closePosition() {
  if (!position || curIdx < 0) return;
  const tk = TICKS[curIdx];
  const exitPrice = position.dir === 'buy' ? tk.b : tk.a;
  const pips = position.dir === 'buy'
    ? (exitPrice - position.entryPrice) * 100
    : (position.entryPrice - exitPrice) * 100;
  tradeHistory.push({
    dir: position.dir,
    entryTime: position.entryTime,
    entryPrice: position.entryPrice,
    exitTime: tk.t,
    exitPrice,
    pips,
  });
  saveHistory();
  position = null;
  removePositionLine();
  updateTradeButtons();
  renderPositionStatus(curIdx);
  renderHistory();
  refreshChartMarkers();
}

function cancelPosition() {
  position = null;
  removePositionLine();
  updateTradeButtons();
  renderPositionStatus(-1);
  refreshChartMarkers();
}

function renderPositionStatus(i) {
  const statusEl = document.getElementById('posStatus');
  const entryEl = document.getElementById('posEntry');
  const pnlEl = document.getElementById('posPnl');
  const barStatusEl = document.getElementById('barStatus');
  const barPnlEl = document.getElementById('barPnl');
  if (!position) {
    statusEl.textContent = 'ポジションなし';
    entryEl.textContent = '-';
    pnlEl.textContent = '-';
    pnlEl.className = 'value';
    barStatusEl.textContent = 'ポジションなし';
    barPnlEl.textContent = '-';
    barPnlEl.className = 'pnl';
    return;
  }
  const dirLabel = position.dir === 'buy' ? 'BUY 保有中' : 'SELL 保有中';
  statusEl.textContent = dirLabel;
  entryEl.textContent = `${position.entryPrice.toFixed(3)} (${fmtTime(position.entryTime + JST_OFFSET_MS)})`;
  barStatusEl.textContent = `${dirLabel} @ ${position.entryPrice.toFixed(3)}`;
  if (i != null && i >= 0) {
    const tk = TICKS[i];
    const pips = position.dir === 'buy'
      ? (tk.b - position.entryPrice) * 100
      : (position.entryPrice - tk.a) * 100;
    const pipsText = (pips >= 0 ? '+' : '') + pips.toFixed(1) + ' pips';
    const pipsClass = pips >= 0 ? 'pnl-pos' : 'pnl-neg';
    pnlEl.textContent = pipsText;
    pnlEl.className = 'value ' + pipsClass;
    barPnlEl.textContent = pipsText;
    barPnlEl.className = 'pnl ' + pipsClass;
  }
}

function renderHistory() {
  const tbody = document.getElementById('historyBody');
  tbody.innerHTML = '';
  let wins = 0, totalPips = 0;
  for (const t of tradeHistory) {
    totalPips += t.pips;
    if (t.pips > 0) wins++;
  }
  const n = tradeHistory.length;
  document.getElementById('histCount').textContent = n;
  document.getElementById('histWinRate').textContent = n ? ((wins / n) * 100).toFixed(1) + '%' : '-';
  document.getElementById('histTotalPips').textContent = (totalPips >= 0 ? '+' : '') + totalPips.toFixed(1);

  for (let idx = tradeHistory.length - 1; idx >= 0; idx--) {
    const t = tradeHistory[idx];
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${fmtTime(t.exitTime + JST_OFFSET_MS)}</td>` +
      `<td>${t.dir === 'buy' ? 'BUY' : 'SELL'}</td>` +
      `<td>${t.entryPrice.toFixed(3)}</td>` +
      `<td>${t.exitPrice.toFixed(3)}</td>` +
      `<td class="${t.pips >= 0 ? 'pnl-pos' : 'pnl-neg'}">${(t.pips >= 0 ? '+' : '') + t.pips.toFixed(1)}</td>`;
    tbody.appendChild(tr);
  }
  const exportBtn = document.getElementById('exportReportBtn');
  if (exportBtn) exportBtn.disabled = visibleTrades().length === 0;
}

const statusEl = document.getElementById('statusMsg');
function setStatus(text, kind) {
  statusEl.textContent = text || '';
  statusEl.className = 'msg' + (kind ? ' ' + kind : '');
}

function pad(n) { return String(n).padStart(2, '0'); }

function jstDateStr(d) { return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }

// datetime-local文字列（"YYYY-MM-DDTHH:mm"）をJST壁時計として解釈し、UTC epoch(ms)に変換
function jstInputToEpoch(s) {
  const [datePart, timePart] = s.split('T');
  const [Y, M, D] = datePart.split('-').map(Number);
  const [hh, mm] = (timePart || '00:00').split(':').map(Number);
  return Date.UTC(Y, M - 1, D, hh, mm) - JST_OFFSET_MS;
}

// UTC epoch(ms)をdatetime-local文字列（"YYYY-MM-DDTHH:mm"、JST壁時計）に変換
function epochToJstInputStr(epochMs) {
  const d = new Date(epochMs + JST_OFFSET_MS);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}` +
    `T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
}

// JST日付("YYYY-MM-DD")の配列を、start〜endのJST暦日で列挙
function listJstDates(startStr, endStr) {
  const startDate = startStr.split('T')[0];
  const endDate = endStr.split('T')[0];
  const [sy, sm, sd] = startDate.split('-').map(Number);
  const [ey, em, ed] = endDate.split('-').map(Number);
  let cur = Date.UTC(sy, sm - 1, sd);
  const end = Date.UTC(ey, em - 1, ed);
  const out = [];
  while (cur <= end) {
    const d = new Date(cur);
    out.push(jstDateStr(d));
    cur += 86400000;
  }
  return out;
}

function minuteClosesFromTicks(ticks) {
  const closes = [];
  let minute = null;
  let close = null;
  for (const tk of ticks) {
    const currentMinute = Math.floor((tk.t + JST_OFFSET_MS) / 60000) * 60;
    if (currentMinute !== minute) {
      if (close != null) closes.push(close);
      minute = currentMinute;
    }
    close = tk.m;
  }
  if (close != null) closes.push(close);
  return closes;
}

function rebuildSmaCache() {
  const closes = SMA_WARMUP_CLOSES.concat(BARS.map(bar => bar.c));
  SMA_PREFIX = new Array(closes.length + 1).fill(0);
  for (let i = 0; i < closes.length; i++) SMA_PREFIX[i + 1] = SMA_PREFIX[i] + closes[i];

  const offset = SMA_WARMUP_CLOSES.length;
  SMA_BY_BAR = BARS.map((bar, barIndex) => {
    const idx = offset + barIndex;
    const start = idx - smaPeriod + 1;
    if (start < 0) return null;
    return { time: bar.t, value: (SMA_PREFIX[idx + 1] - SMA_PREFIX[start]) / smaPeriod };
  });

  if (smaSeries) {
    smaSeries.applyOptions({
      title: `SMA${smaPeriod}`,
      visible: smaOn,
    });
  }
  document.getElementById('smaState').textContent = `SMA${smaPeriod}｜過去${smaPeriod}本の終値平均`;
}

function currentSmaValue(barIndex, currentClose) {
  const idx = SMA_WARMUP_CLOSES.length + barIndex;
  const start = idx - smaPeriod + 1;
  if (start < 0 || !SMA_PREFIX.length) return null;
  const previousSum = SMA_PREFIX[idx] - SMA_PREFIX[start];
  return (previousSum + currentClose) / smaPeriod;
}

function renderSmaAtCurrentBar(barIndex, currentClose, resetCompleted) {
  if (!smaSeries) return;
  smaSeries.applyOptions({ visible: smaOn, title: `SMA${smaPeriod}` });
  if (!smaOn) return;
  if (resetCompleted) smaSeries.setData(SMA_BY_BAR.slice(0, barIndex).filter(Boolean));
  const value = currentSmaValue(barIndex, currentClose);
  if (value != null) smaSeries.update({ time: BARS[barIndex].t, value });
}

function refreshSmaDisplay() {
  rebuildSmaCache();
  if (!smaSeries) return;
  if (!smaOn || curBarId < 0) {
    smaSeries.setData([]);
    smaSeries.applyOptions({ visible: smaOn });
    return;
  }
  renderSmaAtCurrentBar(curBarId, c, true);
}

function syncSmaUrl() {

  params.set('sma_on', smaOn ? '1' : '0');

async function fetchDay(dateStr) {
  const res = await fetch(`data/${PAIR}/${dateStr}.json`);
  if (!res.ok) return null;
  return res.json();
}

async function loadRange() {
  const startStr = document.getElementById('startInput').value;
  const endStr = document.getElementById('endInput').value;
  if (!startStr || !endStr) { setStatus('開始・終了を入力してください', 'error'); return; }

  const startEpoch = jstInputToEpoch(startStr);
  const endEpoch = jstInputToEpoch(endStr);
  if (endEpoch <= startEpoch) { setStatus('終了は開始より後にしてください', 'error'); return; }

  const visibleDates = listJstDates(startStr, endStr).filter(d => manifest.dates.includes(d));
  if (visibleDates.length === 0) {
    setStatus('この期間のデータがありません（休日・データ範囲外の可能性）', 'error');
    return;
  }
  const firstVisiblePos = manifest.dates.indexOf(visibleDates[0]);
  const warmupDate = firstVisiblePos > 0 ? manifest.dates[firstVisiblePos - 1] : null;
  const dates = warmupDate ? [warmupDate, ...visibleDates] : [...visibleDates];
  if (visibleDates.length > 15) {
    setStatus(`${visibleDates.length}日分のデータを読み込みます。時間がかかる場合があります…`, 'warn');
  } else {
    setStatus('読み込み中…', 'info');
  }

  document.getElementById('loadBtn').disabled = true;
  document.getElementById('latestBtn').disabled = true;
  try {
    const dayPayloads = [];
    for (const d of dates) {
      const p = await fetchDay(d);
      if (p) dayPayloads.push(p);
    }
    const merged = [];
    const warmup = [];
    for (const p of dayPayloads) {
      const n = p.t.length;
      for (let i = 0; i < n; i++) {
        const t = p.t[i];
        if (t >= endEpoch) continue;
        const b = p.b[i], a = p.a[i];
        const tick = { t, b, a, m: Math.round((b + a) / 2 * 1000) / 1000 };
        if (t >= startEpoch) merged.push(tick);
        else warmup.push(tick);
      }
    }
    merged.sort((a, b) => a.t - b.t);
    warmup.sort((a, b) => a.t - b.t);
    if (merged.length === 0) {
      setStatus('選択期間にティックがありません（時間外の可能性）', 'error');
      pendingEventMarker = null;
      return;
    }
    if (merged.length > HARD_CAP) {
      setStatus(`ティック数が多すぎます（${merged.length.toLocaleString()}件）。期間を狭めてください。`, 'error');
      pendingEventMarker = null;
      return;
    }
    const warn = merged.length > SOFT_CAP
      ? `注意: ${merged.length.toLocaleString()}件と多めです。動作が重い場合は期間を狭めてください。` : '';
    setStatus(warn, warn ? 'warn' : '');

    buildAndShow(merged, startStr, endStr, warmup);
    const params = new URLSearchParams();
    params.set('start', startStr);
    params.set('end', endStr);
    params.set('sma', String(smaPeriod));
    params.set('sma_on', smaOn ? '1' : '0');
    history.replaceState(null, '', '?' + params.toString());
  } catch (e) {
    console.error(e);
    setStatus('データ取得中にエラーが発生しました', 'error');
    pendingEventMarker = null;
  } finally {
    document.getElementById('loadBtn').disabled = false;
    document.getElementById('latestBtn').disabled = false;
  }
}

function buildAndShow(ticks, startStr, endStr, warmupTicks) {
  TICKS = ticks;
  N = TICKS.length;

  // JST表示用にシフトした時刻で1分足を構成（lightweight-chartsにUTCとして渡す表示ハック）
  const bars = [];
  let curMinute = null, barIdx = -1;
  for (let i = 0; i < N; i++) {
    const disp = TICKS[i].t + JST_OFFSET_MS;
    const minute = Math.floor(disp / 60000) * 60;
    if (minute !== curMinute) {
      bars.push({ t: minute, o: TICKS[i].m, h: TICKS[i].m, l: TICKS[i].m, c: TICKS[i].m, s: i });
      curMinute = minute;
      barIdx++;
    } else {
      const bar = bars[barIdx];
      if (TICKS[i].m > bar.h) bar.h = TICKS[i].m;
      if (TICKS[i].m < bar.l) bar.l = TICKS[i].m;
      bar.c = TICKS[i].m;
    }
    TICKS[i].g = barIdx;
  }
  BARS = bars;
  SMA_WARMUP_CLOSES = minuteClosesFromTicks(warmupTicks || []).slice(-500);

  document.getElementById('rangeLabel').textContent =
    `${startStr.replace('T', ' ')} 〜 ${endStr.replace('T', ' ')}（JST）　全 ${N.toLocaleString()} ティック / ${BARS.length.toLocaleString()} 本（1分足）`;
  document.getElementById('chartCard').style.display = 'block';
  document.getElementById('tradeCard').style.display = 'block';
  document.getElementById('tradeBar').classList.add('show');
  document.body.classList.add('has-tradebar');
  cancelPosition();

  if (!chart) {
    chart = LightweightCharts.createChart(document.getElementById('chart'), {
      autoSize: true,
      layout: { background: { color: '#ffffff' }, textColor: '#1e293b' },
      grid: { vertLines: { color: '#f1f5f9' }, horzLines: { color: '#f1f5f9' } },
      timeScale: { timeVisible: true, secondsVisible: true, borderColor: '#e2e8f0' },
      rightPriceScale: { borderColor: '#e2e8f0', autoScale: true, scaleMargins: { top: priceMargin, bottom: priceMargin } },
      handleScroll: { vertTouchDrag: false },
      handleScale: {
        axisPressedMouseMove: { time: true, price: true },
        axisDoubleClickReset: { price: true, time: true },
        pinch: true,
        mouseWheel: true,
      },
    });
    series = chart.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350',
      borderUpColor: '#26a69a', borderDownColor: '#ef5350',
      wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });
    smaSeries = chart.addLineSeries({
      color: '#06b6d4',
      lineWidth: 2,
      priceLineVisible: false,
      lastValueVisible: true,
      crosshairMarkerVisible: true,
      title: `SMA${smaPeriod}`,
      visible: smaOn,
    });
  }

  rebuildSmaCache();

  if (pendingEventMarker) {
    const dispMs = pendingEventMarker.epoch + JST_OFFSET_MS;
    const targetSec = Math.floor(dispMs / 60000) * 60;
    const barT = nearestBarTime(targetSec);
    activeEventMarker = barT == null ? null : {
      time: barT, position: 'aboveBar', color: '#f59e0b', shape: 'arrowDown',
      text: pendingEventMarker.label,
    };
    pendingEventMarker = null;
  } else {
    activeEventMarker = null;
  }

  playing = false;
  document.getElementById('playBtn').textContent = '▶ 再生';
  curBarId = -1;
  series.setData([]);
  smaSeries.setData([]);
  seekTo(0);
  chart.timeScale().fitContent();
  document.getElementById('copyUrlBtn').disabled = false;
}

// BARS内でtargetSec(秒)に最も近いバー時刻を返す
function nearestBarTime(targetSec) {
  if (!BARS.length) return null;
  let lo = 0, hi = BARS.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (BARS[mid].t < targetSec) lo = mid + 1; else hi = mid;
  }
  if (lo > 0 && Math.abs(BARS[lo - 1].t - targetSec) <= Math.abs(BARS[lo].t - targetSec)) {
    return BARS[lo - 1].t;
  }
  return BARS[lo].t;
}

function fmtTime(ms) {
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`;
}

function applyTick(i) {
  const tk = TICKS[i];
  if (tk.g !== curBarId) {
    if (curBarId >= 0) {
      const prevBar = BARS[curBarId];
      series.update({ time: prevBar.t, open: prevBar.o, high: prevBar.h, low: prevBar.l, close: prevBar.c });
    }
    curBarId = tk.g;
    o = tk.m; h = tk.m; l = tk.m; c = tk.m;
  } else {
    if (tk.m > h) h = tk.m;
    if (tk.m < l) l = tk.m;
    c = tk.m;
  }
  const bar = BARS[curBarId];
  series.update({ time: bar.t, open: o, high: h, low: l, close: c });
  renderSmaAtCurrentBar(curBarId, c, false);
}

function renderStats(i) {
  const tk = TICKS[i];
  document.getElementById('curTime').textContent = fmtTime(tk.t + JST_OFFSET_MS);
  document.getElementById('curBid').textContent = tk.b.toFixed(3);
  document.getElementById('curAsk').textContent = tk.a.toFixed(3);
  document.getElementById('curSpread').textContent = ((tk.a - tk.b) * 100).toFixed(1) + ' pips';
  document.getElementById('curBar').textContent = `${o.toFixed(3)} / ${h.toFixed(3)} / ${l.toFixed(3)} / ${c.toFixed(3)}`;
  document.getElementById('progressLabel').textContent = `${(i+1).toLocaleString()} / ${N.toLocaleString()}`;
  document.getElementById('seekBar').value = Math.round((i / (N-1)) * 1000);
  renderPositionStatus(i);
}

function seekTo(targetIdx) {
  targetIdx = Math.max(0, Math.min(N-1, targetIdx));
  const targetBar = TICKS[targetIdx].g;
  const completed = BARS.slice(0, targetBar).map(b => ({ time:b.t, open:b.o, high:b.h, low:b.l, close:b.c }));
  series.setData(completed);
  const startTick = BARS[targetBar].s;
  o = TICKS[startTick].m; h = o; l = o; c = o;
  for (let i = startTick; i <= targetIdx; i++) {
    const m = TICKS[i].m;
    if (i === startTick) { o=m; h=m; l=m; c=m; }
    else { if (m>h) h=m; if (m<l) l=m; c=m; }
  }
  curBarId = targetBar;
  series.update({ time: BARS[targetBar].t, open:o, high:h, low:l, close:c });
  renderSmaAtCurrentBar(targetBar, c, true);
  curIdx = targetIdx;
  simMs = TICKS[targetIdx].t - TICKS[0].t;
  renderStats(targetIdx);
  refreshChartMarkers();
  chart.timeScale().fitContent();
}

function step() {
  if (!playing) return;
  const now = performance.now();
  const realDelta = lastFrameTs === null ? 0 : (now - lastFrameTs);
  lastFrameTs = now;
  const speedSel = document.getElementById('speedSel').value;

  if (speedSel === 'max') {
    const CHUNK = 2000;
    const end = Math.min(N-1, curIdx + CHUNK);
    for (let i = curIdx+1; i <= end; i++) applyTick(i);
    curIdx = end;
  } else {
    const speed = parseFloat(speedSel);
    simMs += realDelta * speed;
    const targetT = TICKS[0].t + simMs;
    let i = curIdx + 1;
    while (i < N && TICKS[i].t <= targetT) { applyTick(i); i++; }
    curIdx = i - 1;
  }

  if (curIdx >= 0) renderStats(curIdx);
  if (curIdx >= N-1) { playing = false; document.getElementById('playBtn').textContent = '▶ 再生'; return; }
  requestAnimationFrame(step);
}

function escapeHtml(value) {
  const map = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  return String(value).replace(/[&<>"']/g, char => map[char]);
}

function signedPips(value) {
  return `${value >= 0 ? '+' : ''}${value.toFixed(1)}`;
}

function summarizeTrades(trades) {
  const pips = trades.map(trade => Number(trade.pips));
  const winningPips = pips.filter(value => value > 0);
  const losingPips = pips.filter(value => value < 0);
  const wins = pips.filter(value => value > 0).length;
  const losses = pips.filter(value => value < 0).length;
  const grossProfit = pips.filter(value => value > 0).reduce((sum, value) => sum + value, 0);
  const grossLoss = -pips.filter(value => value < 0).reduce((sum, value) => sum + value, 0);
  let equity = 0, peak = 0, maxDrawdown = 0;
  for (const value of pips) {
    equity += value;
    peak = Math.max(peak, equity);
    maxDrawdown = Math.max(maxDrawdown, peak - equity);
  }
  const side = dir => {
    const subset = trades.filter(trade => trade.dir === dir);
    const total = subset.reduce((sum, trade) => sum + Number(trade.pips), 0);
    return { count: subset.length, total_pips: total, average_pips: subset.length ? total / subset.length : 0 };
  };
  const total = pips.reduce((sum, value) => sum + value, 0);
  return {
    trade_count: trades.length,
    wins,
    losses,
    breakeven: trades.length - wins - losses,
    win_rate_pct: trades.length ? wins / trades.length * 100 : 0,
    total_pips: total,
    average_pips: trades.length ? total / trades.length : 0,
    gross_profit_pips: grossProfit,
    gross_loss_pips: grossLoss,
    profit_factor: grossLoss > 0 ? grossProfit / grossLoss : null,
    max_win_pips: winningPips.length ? Math.max(...winningPips) : 0,
    max_loss_pips: losingPips.length ? Math.min(...losingPips) : 0,
    max_drawdown_pips: maxDrawdown,
    buy: side('buy'),
    sell: side('sell'),
  };
}

function reportTradeRows(trades) {
  return trades.map((trade, index) => {
    const durationSec = Math.max(0, Math.round((trade.exitTime - trade.entryTime) / 1000));
    return `<tr>
      <td>${index + 1}</td>
      <td><span class="side ${trade.dir}">${trade.dir === 'buy' ? 'BUY' : 'SELL'}</span></td>
      <td>${escapeHtml(fmtTime(trade.entryTime + JST_OFFSET_MS))}</td>
      <td>${Number(trade.entryPrice).toFixed(3)}</td>
      <td>${escapeHtml(fmtTime(trade.exitTime + JST_OFFSET_MS))}</td>
      <td>${Number(trade.exitPrice).toFixed(3)}</td>
      <td>${Math.floor(durationSec / 60)}分${durationSec % 60}秒</td>
      <td class="${trade.pips >= 0 ? 'positive' : 'negative'}">${signedPips(Number(trade.pips))}</td>
    </tr>`;
  }).join('');
}

<style>
:root{--ink:#172033;--muted:#64748b;--line:#dbe3ec;--panel:#fff;--bg:#f4f7fa;--pos:#087f5b;--neg:#c92a2a;--accent:#0f766e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.55}.page{max-width:1120px;margin:0 auto;padding:32px 20px 60px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em}h1{margin:5px 0 2px;font-size:28px}h2{margin:0 0 14px;font-size:18px}.meta{color:var(--muted);font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.metric{background:#f8fafc;border:1px solid #e8eef4;border-radius:10px;padding:12px}.metric .label{font-size:11px;color:var(--muted)}.metric .value{font-size:20px;font-weight:800;margin-top:2px}.positive{color:var(--pos);font-weight:700}.negative{color:var(--neg);font-weight:700}.chart{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:9px;background:#fff}.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 0 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.buyDot{background:#16a34a}.sellDot{background:#dc2626}.exitDot{background:#475569}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{padding:9px 8px;text-align:left;border-bottom:1px solid #edf1f5}th{color:var(--muted);font-size:11px}.side{display:inline-block;padding:2px 7px;border-radius:999px;color:#fff;font-size:11px;font-weight:800}.side.buy{background:#16a34a}.side.sell{background:#dc2626}.prompt{background:#ecfdf5;border-left:4px solid var(--accent);padding:14px;border-radius:6px;font-size:14px}.json{max-height:400px;overflow:auto;background:#101827;color:#d9e4f0;padding:14px;border-radius:9px;font:12px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-word}details summary{cursor:pointer;font-weight:700}.note{color:var(--muted);font-size:12px;margin-top:9px}
@media(max-width:760px){.page{padding:20px 12px 50px}h1{font-size:22px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:14px}.metric .value{font-size:18px}}
@media print{body{background:#fff}.page{max-width:none;padding:0}.panel{box-shadow:none;break-inside:avoid}}
</style></head><body><main class="page">
<div class="eyebrow">TICK REPLAY / TRADE REVIEW</div><h1>${PAIR} 売買分析レポート</h1>
<div class="meta">作成: ${escapeHtml(data.generated_at_jst)} JST ｜ 対象: ${escapeHtml(data.chart_range_jst.start)} 〜 ${escapeHtml(data.chart_range_jst.replayed_until)} JST ｜ SMA${smaPeriod}${smaOn ? '表示' : '非表示'}</div>
<section class="panel"><h2>損益サマリー</h2><div class="metrics">
<div class="metric"><div class="label">合計</div><div class="value ${summary.total_pips >= 0 ? 'positive' : 'negative'}">${signedPips(summary.total_pips)} pips</div></div>
<div class="metric"><div class="label">取引数</div><div class="value">${summary.trade_count}</div></div>
<div class="metric"><div class="label">勝率</div><div class="value">${summary.win_rate_pct.toFixed(1)}%</div></div>
<div class="metric"><div class="label">PF</div><div class="value">${pfText}</div></div>
<div class="metric"><div class="label">最大DD</div><div class="value negative">-${summary.max_drawdown_pips.toFixed(1)} pips</div></div>
<div class="metric"><div class="label">平均</div><div class="value ${summary.average_pips >= 0 ? 'positive' : 'negative'}">${signedPips(summary.average_pips)} pips</div></div>
<div class="metric"><div class="label">最大利益</div><div class="value positive">${signedPips(summary.max_win_pips)} pips</div></div>
<div class="metric"><div class="label">最大損失</div><div class="value negative">${signedPips(summary.max_loss_pips)} pips</div></div>
<div class="metric"><div class="label">BUY</div><div class="value">${summary.buy.count}回 / ${signedPips(summary.buy.total_pips)}p</div></div>
<div class="metric"><div class="label">SELL</div><div class="value">${summary.sell.count}回 / ${signedPips(summary.sell.total_pips)}p</div></div>
</div></section>
<section class="panel"><h2>チャートと売買位置</h2><img class="chart" src="${chartPng}" alt="売買マーカー付きチャート"><div class="legend"><span><i class="dot buyDot"></i>BUY</span><span><i class="dot sellDot"></i>SELL</span><span><i class="dot exitDot"></i>決済（横の数値は損益pips）</span></div></section>
<section class="panel"><h2>取引明細</h2><div class="tableWrap"><table><thead><tr><th>No.</th><th>方向</th><th>エントリー JST</th><th>価格</th><th>決済 JST</th><th>価格</th><th>保有</th><th>損益 pips</th></tr></thead><tbody>${reportTradeRows(trades)}</tbody></table></div></section>
<section class="panel"><h2>AIに依頼するときの例</h2><div class="prompt">${escapeHtml(aiPrompt)}</div><div class="note">このHTMLファイルをAIへ添付し、上の文章を送ってください。チャート画像と取引データが1ファイルに入っています。</div></section>
<section class="panel"><details><summary>AI解析用JSONを表示</summary><pre id="trade-analysis-data" class="json">${escapeHtml(json)}</pre></details></section>
</main></body></html>`;

    const stamp = data.generated_at_jst.replace(/[-: ]/g, '').slice(0, 13);
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = `${PAIR}_trade_analysis_${stamp}.html`;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    setStatus('分析レポートを保存しました（チャート・売買位置・損益・AI用データ）', 'info');
  } catch (error) {
    console.error(error);
    setStatus('分析レポートの作成に失敗しました。ページを再読み込みしてお試しください', 'error');
  } finally {
    exportBtn.textContent = '分析レポート出力';
    exportBtn.disabled = visibleTrades().length === 0;
  }
}

document.getElementById('eventTypeSel').addEventListener('change', (e) => {
  const name = e.target.value;
  const occSel = document.getElementById('eventOccurrenceSel');
  occSel.innerHTML = '<option value="">選択...</option>';
  occSel.disabled = !name;
  document.getElementById('eventLoadBtn').disabled = true;
  if (!name) return;
  const matches = EVENTS.filter(ev => ev.name === name).sort((a, b) => a.jst.localeCompare(b.jst));
  for (const ev of matches) {
    const opt = document.createElement('option');
    opt.value = ev.jst;
    opt.textContent = `${ev.period}（${ev.jst.replace('T', ' ')} JST）`;
    occSel.appendChild(opt);
  }
});

document.getElementById('eventOccurrenceSel').addEventListener('change', (e) => {
  document.getElementById('eventLoadBtn').disabled = !e.target.value;
});

document.getElementById('eventLoadBtn').addEventListener('click', () => {
  const name = document.getElementById('eventTypeSel').value;
  const jstStr = document.getElementById('eventOccurrenceSel').value;
  if (!jstStr || !manifest) return;
  const evEpoch = jstInputToEpoch(jstStr);
  const matched = EVENTS.find(ev => ev.name === name && ev.jst === jstStr);
  pendingEventMarker = { epoch: evEpoch, label: matched ? `${matched.name} ${matched.period}` : name };
  document.getElementById('startInput').value = epochToJstInputStr(evEpoch - 30 * 60000);
  document.getElementById('endInput').value = epochToJstInputStr(evEpoch + 60 * 60000);
  loadRange();
});

document.getElementById('loadBtn').addEventListener('click', loadRange);
document.getElementById('latestBtn').addEventListener('click', () => {
  if (!manifest) return;
  document.getElementById('startInput').value = manifest.max + 'T00:00';
  document.getElementById('endInput').value = manifest.max + 'T23:59';
  loadRange();
});

document.getElementById('copyUrlBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(location.href);
    setStatus('URLをコピーしました。共有すると同じ期間が開きます', 'info');
  } catch (e) {
    setStatus('コピーに失敗しました。アドレスバーから直接コピーしてください', 'warn');
  }
});

document.getElementById('playBtn').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸ 一時停止' : '▶ 再生';
  if (playing) { lastFrameTs = null; requestAnimationFrame(step); }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  playing = false;
  document.getElementById('playBtn').textContent = '▶ 再生';
  curBarId = -1;
  series.setData([]);
  if (smaSeries) smaSeries.setData([]);
  cancelPosition();
  seekTo(0);
});

document.getElementById('barBuyBtn').addEventListener('click', () => openPosition('buy'));
document.getElementById('barSellBtn').addEventListener('click', () => openPosition('sell'));
document.getElementById('barCloseBtn').addEventListener('click', closePosition);
document.getElementById('exportReportBtn').addEventListener('click', exportAnalysisReport);
document.getElementById('clearHistBtn').addEventListener('click', () => {
  if (tradeHistory.length && !confirm('取引履歴を削除しますか？')) return;
  tradeHistory = [];
  saveHistory();
  renderHistory();
  refreshChartMarkers();
});

document.getElementById('seekBar').addEventListener('input', (e) => {
  playing = false;
  document.getElementById('playBtn').textContent = '▶ 再生';
  const idx = Math.round((e.target.value / 1000) * (N-1));
  seekTo(idx);
});

document.getElementById('smaToggle').addEventListener('change', (e) => {
  smaOn = e.target.checked;
  refreshSmaDisplay();
  syncSmaUrl();
});

function applySmaPeriodInput(e) {
  const raw = Number(e.target.value);
  if (!Number.isFinite(raw) || raw < 2) return;
  const value = Math.max(2, Math.min(500, Math.round(raw)));
  smaPeriod = value;
  refreshSmaDisplay();
  syncSmaUrl();
}

document.getElementById('smaPeriodInput').addEventListener('input', applySmaPeriodInput);
document.getElementById('smaPeriodInput').addEventListener('change', (e) => {
  const value = Math.max(2, Math.min(500, Math.round(Number(e.target.value) || 75)));
  e.target.value = String(value);
  applySmaPeriodInput(e);
});

function applyPriceMargin() {
  if (!chart) return;
  chart.priceScale('right').applyOptions({ scaleMargins: { top: priceMargin, bottom: priceMargin } });
}

document.getElementById('zoomSlider').addEventListener('input', (e) => {
  priceMargin = Number(e.target.value) / 100;
  applyPriceMargin();
});

document.getElementById('scaleLockBtn').addEventListener('click', () => {
  autoScaleOn = !autoScaleOn;
  if (chart) chart.priceScale('right').applyOptions({ autoScale: autoScaleOn });
  document.getElementById('scaleLockBtn').textContent = autoScaleOn ? '🔓 自動追従' : '🔒 手動固定';
});

init();
</script>
</body>
</html>
